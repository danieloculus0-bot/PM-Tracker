name: Build Windows Server Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --name "PM Tracker" .\app.py

      - name: Create blank import workbook
        shell: pwsh
        run: python .\tools\create_blank_template.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows Server installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\PM-Tracker-Server.iss'

      - name: Assemble portable server bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\server-bundle | Out-Null
          Copy-Item '.\dist\PM Tracker.exe' '.\server-bundle\PM Tracker.exe'
          Copy-Item '.\site_config.example.json' '.\server-bundle\site_config.example.json'
          Copy-Item '.\PM_Tracker_Import_Template.xlsx' '.\server-bundle\PM_Tracker_Import_Template.xlsx'
          Copy-Item '.\server\install-server.ps1' '.\server-bundle\install-server.ps1'
          Copy-Item '.\server\uninstall-server.ps1' '.\server-bundle\uninstall-server.ps1'
          Copy-Item '.\README.md' '.\server-bundle\README.md'
          Compress-Archive -Path .\server-bundle\* -DestinationPath .\PM-Tracker-Server-x64.zip -Force
          Get-FileHash '.\dist\PM Tracker.exe' -Algorithm SHA256 | ForEach-Object { "PM Tracker.exe SHA256: $($_.Hash)" } | Set-Content .\SHA256SUMS.txt
          Get-FileHash '.\installer\installer-output\PM-Tracker-Server-Setup.exe' -Algorithm SHA256 | ForEach-Object { "PM-Tracker-Server-Setup.exe SHA256: $($_.Hash)" } | Add-Content .\SHA256SUMS.txt
          Get-FileHash '.\PM-Tracker-Server-x64.zip' -Algorithm SHA256 | ForEach-Object { "PM-Tracker-Server-x64.zip SHA256: $($_.Hash)" } | Add-Content .\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PM-Tracker-Windows-Server
          path: |
            PM-Tracker-Server-x64.zip
            installer/installer-output/PM-Tracker-Server-Setup.exe
            SHA256SUMS.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PM-Tracker-Server-x64.zip
            installer/installer-output/PM-Tracker-Server-Setup.exe
            SHA256SUMS.txt
