name: Build Generic Windows Server Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compile source
        shell: pwsh
        run: python -m py_compile .\app.py

      - name: Smoke test blank deployment and import routes
        shell: pwsh
        run: |
          @'
          import os
          import sys
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="pm-tracker-release-"))
          os.chdir(root)
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])

          import app as pm

          pm.ensure_data_workbook()
          pm.init_db()
          client = pm.app.test_client()

          for route in ["/", "/import", "/template.xlsx", "/export.xlsx"]:
              response = client.get(route)
              assert response.status_code == 200, (route, response.status_code)

          wb = pm.get_workbook()
          assert {"Machines", "PM_Tasks", "Completion_Log"}.issubset(set(wb.sheetnames))
          wb.close()

          print("PM Tracker server smoke test OK")
          '@ | python

      - name: Test generic import and manual entry with fictional data
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --name "PM Tracker" .\app.py

      - name: Smoke packaged Windows executable from an isolated blank directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP "pm-tracker-exe-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $exe = Join-Path $work "PM Tracker.exe"
          Copy-Item '.\\dist\\PM Tracker.exe' $exe

          # Reserve a loopback port, then release it before the app starts.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          @{ host = '127.0.0.1'; port = $port; weather_enabled = $false } |
            ConvertTo-Json | Set-Content (Join-Path $work 'site_config.json') -Encoding utf8

          $process = $null
          try {
            $process = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru -RedirectStandardOutput (Join-Path $work 'stdout.txt') -RedirectStandardError (Join-Path $work 'stderr.txt')
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { throw "Packaged application exited before HTTP readiness: $($process.ExitCode)" }
              try {
                $result = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                if ($result.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { throw 'Packaged app did not return HTTP 200 on loopback within smoke-test window' }
            foreach ($name in @('pm_app.db', 'pm_data.xlsx')) {
              if (-not (Test-Path (Join-Path $work $name))) { throw "Packaged app did not initialize $name" }
            }
            Write-Host 'Packaged Windows EXE HTTP/data initialization smoke passed'
          } finally {
            if ($process -and -not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Create blank import workbook
        shell: pwsh
        run: python .\tools\create_blank_template.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows Server installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\PM-Tracker-Server.iss'

      - name: Assemble sanitized Generic server bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\server-bundle | Out-Null

          Copy-Item '.\dist\PM Tracker.exe' '.\server-bundle\PM Tracker.exe'
          Copy-Item '.\site_config.example.json' '.\server-bundle\site_config.example.json'
          Copy-Item '.\PM_Tracker_Import_Template.xlsx' '.\server-bundle\PM_Tracker_Import_Template.xlsx'
          Copy-Item '.\PM_Tracker_Machines_Only_Template.xlsx' '.\server-bundle\PM_Tracker_Machines_Only_Template.xlsx'
          Copy-Item '.\server\install-server.ps1' '.\server-bundle\install-server.ps1'
          Copy-Item '.\server\uninstall-server.ps1' '.\server-bundle\uninstall-server.ps1'
          Copy-Item '.\README.md' '.\server-bundle\README.md'
          Copy-Item '.\docs\EXCEL_IMPORT.md' '.\server-bundle\EXCEL_IMPORT.md'
          Copy-Item '.\docs\WINDOWS_SERVER_INSTALL.md' '.\server-bundle\WINDOWS_SERVER_INSTALL.md'

          @(
            "PM Tracker Windows Server Release"
            "Commit: $env:GITHUB_SHA"
            "Build: $env:GITHUB_RUN_NUMBER"
            "Sanitized: yes"
            "Production machine data included: no"
            "Production PM history included: no"
            "Spreadsheet import sheets: Machines, PM_Tasks, Completion_Log, Maintenance_Requests"
            "Runtime data path: C:\ProgramData\PM Tracker"
          ) | Set-Content .\RELEASE_MANIFEST.txt

          Copy-Item '.\RELEASE_MANIFEST.txt' '.\server-bundle\RELEASE_MANIFEST.txt'

          Compress-Archive -Path .\server-bundle\* -DestinationPath .\PM-Tracker-Generic-Server-x64.zip -Force

          Get-FileHash '.\dist\PM Tracker.exe' -Algorithm SHA256 |
            ForEach-Object { "PM Tracker.exe SHA256: $($_.Hash)" } |
            Set-Content .\SHA256SUMS.txt

          Get-FileHash '.\installer\installer-output\PM-Tracker-Server-Setup.exe' -Algorithm SHA256 |
            ForEach-Object { "PM-Tracker-Server-Setup.exe SHA256: $($_.Hash)" } |
            Add-Content .\SHA256SUMS.txt

          Get-FileHash '.\PM-Tracker-Generic-Server-x64.zip' -Algorithm SHA256 |
            ForEach-Object { "PM-Tracker-Generic-Server-x64.zip SHA256: $($_.Hash)" } |
            Add-Content .\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PM-Tracker-Generic-Windows-Server
          path: |
            PM-Tracker-Generic-Server-x64.zip
            installer/installer-output/PM-Tracker-Server-Setup.exe
            SHA256SUMS.txt
            RELEASE_MANIFEST.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PM-Tracker-Generic-Server-x64.zip
            installer/installer-output/PM-Tracker-Server-Setup.exe
            SHA256SUMS.txt
            RELEASE_MANIFEST.txt
