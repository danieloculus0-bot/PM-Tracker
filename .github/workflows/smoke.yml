name: PM Tracker smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py
      - name: Flask smoke
        run: |
          python - <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="pm-tracker-ci-"))
          os.chdir(root)
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])

          import app as pm

          pm.init_db()
          client = pm.app.test_client()

          for route in ["/", "/import", "/template.xlsx", "/export.xlsx"]:
              response = client.get(route)
              assert response.status_code == 200, (route, response.status_code)

          wb = pm.get_workbook()
          assert {"Machines", "PM_Tasks", "Completion_Log"}.issubset(set(wb.sheetnames))
          wb.close()

          # Synthetic PM record, with a second machine to detect cross-machine task spoofing.
          wb = pm.get_workbook()
          wb["Machines"].append(["SYN-M01", "Fictional Press", "Demo", "Test Bay"])
          wb["Machines"].append(["SYN-M02", "Fictional Mill", "Demo", "Test Bay"])
          wb["PM_Tasks"].append(["SYN-T01", "SYN-M01", "Synthetic inspection", "Test only", "Days", 7])
          wb.save(pm.EXCEL_FILE)
          wb.close()

          valid = {"machine_id": "SYN-M01", "task_id": "SYN-T01",
                   "operator_name": "Synthetic Operator", "completion_notes": "Test only"}
          for invalid in (
              {**valid, "machine_id": "SYN-M02"},
              {**valid, "task_id": "SYN-UNKNOWN"},
              {**valid, "machine_id": "SYN-UNKNOWN"},
          ):
              response = client.post("/complete-task", data=invalid)
              assert response.status_code == 404, (invalid, response.status_code)
          assert pm.latest_completion("SYN-M01", "SYN-T01") is None

          response = client.post("/complete-task", data=valid)
          assert response.status_code == 302, response.status_code
          # A fresh SQLite connection must see the persisted completion.
          saved = pm.latest_completion("SYN-M01", "SYN-T01")
          assert saved is not None and saved["operator_name"] == "Synthetic Operator"
          assert saved["completion_notes"] == "Test only"
          assert pm.latest_completion("SYN-M02", "SYN-T01") is None

          print("PM Tracker smoke OK")
          PY
